# OpenRouter Better Proxy — Configuration
#
# Example configuration. Adjust hosts/models/prices to your environment.
#
# QUANTIZATION NOTE (2026-08-27): the `quantizations` key is GONE. Every
# OpenRouter endpoint is a provider+quant pair (the quant lives in the slug)
# and OpenRouter can reshape slugs at any time (e.g. "deepseek/fp8" ->
# "deepseek"), so quantization no longer gates or sorts candidates.
# Selection = provider list order, then price. The `strategy: presets` block
# (commented example below) switches a model to preset-slug routing.

server:
    host: 0.0.0.0
    port: 8787
    dashboard: true
    sse_log: true

# Models managed: each section defines a model.
models:
    deepseek/deepseek-v4-flash-0731:
        providers:            # allowlist + priority order (base or full tags)
          - deepseek
          - deepinfra
          - streamlake
          - gmicloud
        max_price:            # $/M tokens gate
            input: 0.30
            completion: 0.80
            cache: 0.10
        # --- Optional: preset-slug routing (strategy: presets) -------------
        # Each attempt targets the mapped OpenRouter preset slug instead of
        # pinning `provider.only`: the outgoing body swaps ONLY `model` and
        # carries no `provider` object. Keys are provider BASES.
        #
        # strategy: presets
        # presets:
        #     deepinfra: deepseek/deepseek-v4-flash-0731@preset/deepseekv4flash-deepinfra
        #     streamlake: deepseek/deepseek-v4-flash-0731@preset/deepseekv4flash-streamlake

    z-ai/glm-5.3-flash:
        providers:
          - z-ai/fp8
          - novita/fp8
          - gmicloud/fp8
        max_price:
            input: 0.076
            completion: 0.26
            cache: 0.016

# Global sections (apply to all models).
migration:
    enabled: true
    hysteresis_mult: 4.0
    est_turns_per_session: 50
    r_cache_estimate: 300000
    out_per_turn_estimate: 40000

refresh:
    interval_minutes: 30
    price_change_threshold: 10.0      # percent points (10 = 10%)
    # Timezone for times WITHOUT suffix — only two clocks exist:
    # "local" = OS timezone of the machine running the proxy (default),
    # "UTC". Nothing else. A time ending in "UTC" always runs on the UTC
    # clock (e.g. "12:01UTC"). Other timezones: convert to UTC yourself.
    default_timezone: local
    times:                            # 24h; e.g. ['03:01', '12:01UTC']
      - '03:01'
      - '06:01'
      - '08:01'
      - '12:01'
      - '18:01'                         

health:
    initial_cooldown_seconds: 300
    consecutive_threshold: 4
    max_cooldown_seconds: 43200
    escalation_seconds:
      - 3600.0

# Per-provider retry before failing over to the next authorized candidate.
retry:
    max_attempts: 3        # total attempts per provider (3 = up to 2 retries)
    delay_seconds: 2.5     # fixed delay between retry attempts

# App attribution headers towards OpenRouter (HTTP-Referer / X-Title).
attribution:
    mode: passthrough      # passthrough | fallback | force
    headers: {}
